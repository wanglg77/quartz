name: Deploy Quartz to Nginx

on:
  push:
    branches:
      - v4

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Build Project
        run: |
          npm install
          npx quartz build

      - name: Deploy static files via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          source: "public/*"
          target: "/var/www/quartz" # 对应上面 Nginx 的 root
          strip_components: 1
          overwrite: true
          # 部署前清理旧文件，防止乱码文件残留
          rm_prev_nodes: true

      - name: Baidu API Submission
        # 只有在部署成功后才通知百度
        run: |
          cd public
          find . -name "*.html" | sed 's|^\.|https://docs.byl-hqm.cn|' > urls.txt
          curl -H 'Content-Type:text/plain' --data-binary @urls.txt "http://data.zz.baidu.com/urls?site=https://docs.byl-hqm.cn&token=${{ secrets.BAIDU_TOKEN }}"