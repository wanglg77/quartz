name: Deploy to Server

on:
  push:
    branches:
      - v4

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          debug: true
          script: |
            # 确保环境变量生效
            export PATH=$PATH:/usr/local/bin:/usr/bin:/bin
            
            # 切换到项目目录
            cd /root/quartz

            # 拉取最新代码
            git fetch origin v4
            git reset --hard origin/v4

            # 安装依赖
            npm install --production

            # 构建项目
            npx quartz build

            # 启动/重启服务
            if pm2 list | grep -q "quartz-medical"; then
              pm2 restart "quartz-medical"
            else
              pm2 start "npx quartz build --serve --port 6066" --name "quartz-medical"
            fi
            
            pm2 save
